<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Status</title>
<meta name="description" content="Whether the app is working, and notes on any problems.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<style>
  /* Brand tokens: BUILD_SPEC.md section 17 (packages/ui/src/tokens). Gold only for warnings. */
  @font-face { font-family: "Figtree"; src: url("assets/figtree-latin.woff2") format("woff2"); font-weight: 300 900; font-display: swap; }
  @font-face { font-family: "Young Serif"; src: url("assets/young-serif-latin.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  :root {
    --ink: #2b1220; --paper: #f5efea; --bone: #faf4ef; --aubergine: #5a2742;
    --muted: rgba(43,18,32,0.7); --border: rgba(43,18,32,0.12); --divider: rgba(43,18,32,0.08);
    --ok-text: #2c4a36; --ok-fill: #dde6dc;
    --warn-text: #6a4d10; --warn-fill: #f1e3c8;
    --err-text: #6e1c1c; --err-fill: #e9d2d2;
    --radius-md: 10px; --radius-lg: 14px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Figtree", ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif; line-height: 1.5; }
  main { max-width: 680px; margin: 0 auto; padding: 40px 16px 64px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
  header img { width: 40px; height: auto; }
  h1, h2 { font-family: "Young Serif", Georgia, serif; font-weight: 400; color: var(--aubergine); letter-spacing: -0.01em; margin: 0; }
  h1 { font-size: 26px; }
  h2 { font-size: 20px; margin: 36px 0 12px; }
  .banner { border-radius: var(--radius-lg); padding: 18px 20px; font-size: 18px; font-weight: 600; }
  .banner.ok { background: var(--ok-fill); color: var(--ok-text); }
  .banner.incident { background: var(--warn-fill); color: var(--warn-text); }
  .banner.down { background: var(--err-fill); color: var(--err-text); }
  .banner.loading { background: var(--bone); color: var(--muted); font-weight: 400; }
  .banner small { display: block; font-weight: 400; font-size: 14px; margin-top: 4px; }
  .notice { background: var(--bone); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 18px 20px; margin-bottom: 12px; }
  .notice h3 { margin: 0 0 4px; font-size: 17px; }
  .meta { color: var(--muted); font-size: 14px; }
  .pill { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 600; margin-right: 6px; }
  .pill.open { background: var(--warn-fill); color: var(--warn-text); }
  .pill.done { background: var(--ok-fill); color: var(--ok-text); }
  .updates { list-style: none; margin: 12px 0 0; padding: 12px 0 0; border-top: 1px solid var(--divider); }
  .updates li { margin-bottom: 10px; }
  .updates li:last-child { margin-bottom: 0; }
  .empty { color: var(--muted); }
  footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--divider); color: var(--muted); font-size: 14px; }
  footer a { color: var(--aubergine); }
</style>
</head>
<body>
<main>
  <header>
    <img src="assets/mark.svg" alt="">
    <h1 id="title">Status</h1>
  </header>

  <div id="banner" class="banner loading" role="status" aria-live="polite">Checking the app…</div>

  <section id="current-section" hidden>
    <h2>Happening now</h2>
    <div id="current"></div>
  </section>

  <section>
    <h2>Last 30 days</h2>
    <div id="recent"><p class="empty">Checking…</p></div>
  </section>

  <footer>
    <p id="checked">Not checked yet.</p>
    <p>Need help? Email <a id="support" href="mailto:support@getblythe.com">support@getblythe.com</a>.</p>
  </footer>
</main>

<script>
  // Point FEED_URL at the production app once it's live (docs/runbooks/status-page.md in the app repo).
  var FEED_URL = 'https://web-37ttvl2s7a-uc.a.run.app/status.json';
  var EVERY_MS = 60 * 1000;
  var lastGood = null;

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function when(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZoneName: 'short' });
  }

  function noticeCard(n) {
    var card = el('article', 'notice');
    card.appendChild(el('h3', null, n.title));
    var meta = el('p', 'meta');
    meta.appendChild(el('span', 'pill ' + (n.resolvedAt ? 'done' : 'open'), n.resolvedAt ? 'Fixed' : n.statusLabel));
    meta.appendChild(document.createTextNode(n.areaLabel + ' · started ' + when(n.startedAt) + (n.resolvedAt ? ' · fixed ' + when(n.resolvedAt) : '')));
    card.appendChild(meta);
    if (n.message) card.appendChild(el('p', null, n.message));
    if (n.updates && n.updates.length > 1) {
      var list = el('ul', 'updates');
      n.updates.forEach(function (u) {
        var li = el('li');
        li.appendChild(el('div', 'meta', u.statusLabel + ' · ' + when(u.at)));
        li.appendChild(el('div', null, u.message));
        list.appendChild(li);
      });
      card.appendChild(list);
    }
    return card;
  }

  function render(feed) {
    if (feed.product) {
      document.getElementById('title').textContent = feed.product + ' status';
      document.title = feed.product + ' status';
    }
    var banner = document.getElementById('banner');
    var current = feed.current || [];
    if (feed.overall === 'ok' || current.length === 0) {
      banner.className = 'banner ok';
      banner.textContent = 'Everything is working';
    } else {
      banner.className = 'banner incident';
      banner.textContent = current.length === 1 ? 'There is a problem we are working on' : 'There are problems we are working on';
    }
    var cur = document.getElementById('current');
    cur.replaceChildren();
    current.forEach(function (n) { cur.appendChild(noticeCard(n)); });
    document.getElementById('current-section').hidden = current.length === 0;

    var rec = document.getElementById('recent');
    rec.replaceChildren();
    var recent = feed.recent || [];
    if (recent.length === 0) rec.appendChild(el('p', 'empty', 'No problems in the last ' + (feed.recentDays || 30) + ' days.'));
    recent.forEach(function (n) { rec.appendChild(noticeCard(n)); });
  }

  function showDown() {
    // Never fall back to "everything is working" when the feed can't be read.
    var banner = document.getElementById('banner');
    banner.className = 'banner down';
    banner.textContent = "We can't reach the app right now";
    var note = el('small', null, lastGood ? 'Last good check ' + when(lastGood.toISOString()) + '. We may already be fixing it.' : 'We may already be fixing it.');
    banner.appendChild(note);
  }

  function check() {
    var now = new Date();
    fetch(FEED_URL, { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (feed) { lastGood = now; render(feed); })
      .catch(function () { showDown(); })
      .then(function () { document.getElementById('checked').textContent = 'Last checked ' + when(now.toISOString()) + '. This page checks again every minute.'; });
  }

  check();
  setInterval(check, EVERY_MS);
</script>
</body>
</html>
